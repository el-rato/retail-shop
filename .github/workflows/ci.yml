name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app training tests scripts

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./tests/test_retail.db
          API_KEY: test-api-key
        run: pytest --cov=app --cov-report=term-missing -q

      - name: Verify app imports & health via TestClient
        run: python -c "from app.main import app; print(app.title)"

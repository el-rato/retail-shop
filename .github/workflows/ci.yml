name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies (core + dev)
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check app training tests scripts frontend

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./tests/test_retail.db
          API_KEY: test-api-key
        run: uv run pytest --cov=app --cov-report=term-missing -q

      - name: Verify app imports & health via TestClient
        run: uv run python -c "from app.main import app; print(app.title)"

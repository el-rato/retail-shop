line-length = 100
target-version = "py311"

[lint]
# Defaults + import sorting + upgrades.
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]

[lint.per-file-ignores]
# Entry scripts run as files; sys.path insertion requires imports after it.
"training/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]

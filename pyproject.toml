[project]
name = "smart-retail-platform"
version = "1.0.0"
description = "AI-Powered Smart Retail & Customer Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core web framework
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Vision
    "numpy>=1.26",
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    # ML
    "scikit-learn>=1.4",
    "nltk>=3.8",
    "joblib>=1.3",
    # Dashboard
    "streamlit>=1.35",
    "plotly>=5.22",
    "pandas>=2.2",
    # Database drivers (PostgreSQL-ready)
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
training = [
    # CI-only: builds release model artifacts without compiling dlib.
    # (TensorFlow is shared with the `ml` group; kept separate so release
    # jobs stay fast and do not require native face-recognition builds.)
    "tensorflow>=2.15,<2.20",
]
ml = [
    # Heavy / native dependencies (optional at runtime, required for full ML)
    "tensorflow>=2.15,<2.20",
    "face-recognition>=1.3.0",
    "dlib>=19.24",
]

[tool.uv]
# This project is an application, not an installable package.
package = false
# `uv sync` installs the dev group by default. Use --no-dev for production,
# --group training to train release artifacts, and --group ml (or --all-groups)
# to add the heavy ML dependencies.
default-groups = ["dev"]
